<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Loja - SteamWave</title>
        <!-- Importação do CSS separado -->
    <link rel="stylesheet" href="../css/styleLoja.css">
    <link rel="stylesheet" href="../css/tema.css" />
    <link rel="stylesheet" href="../css/fontes.css" />
  </head>
  <body>
    <div class="page-container">
      <div class="loja-bg"></div>
      <div class="loja-grid-overlay"></div>
      
      <!-- HEADER LOJA -->
      <div class="loja-header">
        <div class="loja-logo" onclick="window.location.href='loja.html'">
          <div class="retro-sun small"></div>
          <span class="loja-logo-text">SteamWave</span>
        </div>
        <div class="loja-search">
          <span
            class="search-icon"
            id="searchToggle"
            onclick="toggleSearch()"
            title="Pesquisar"
            >🔍</span
          >
          <div class="search-bar" id="searchBar">
            <input type="text" placeholder="Buscar jogos..." />
          </div>
        </div>
        <div
          class="loja-now-playing"
          onclick="showToast('🎵 Reproduzindo: Neon Dreams - SynthWave Radio')"
        >
          <span class="headphone-icon">🎧</span>
          <span>Você está escutando:</span>
        </div>
      </div>

      <!-- CORPO DA LOJA (Sidebar + Main) -->
      <div class="loja-body">
        
        <!-- SIDEBAR: agora é só sobre o que tem na loja, não navegação entre páginas
             (navegação entre páginas já existe no menu fixo debaixo) -->
        <div class="loja-sidebar">

          <!-- CATEGORIAS (filtro funcional) -->
          <div>
            <div class="sidebar-block-title">CATEGORIAS</div>
            <!-- "Todos" é o filtro inicial: loja abre sem nenhum filtro aplicado -->
            <button class="cat-btn active" onclick="filterCategory('todos', this)">🌐 Todos</button>
            <button class="cat-btn" onclick="filterCategory('acao', this)">🎮 Ação</button>
            <button class="cat-btn" onclick="filterCategory('puzzle', this)">🧩 Puzzle</button>
            <button class="cat-btn" onclick="filterCategory('rpg', this)">⚔️ RPG</button>
            <button class="cat-btn" onclick="filterCategory('scifi', this)">🚀 Sci-Fi</button>
            <button class="cat-btn" onclick="filterCategory('retro', this)">👾 Retro</button>
          </div>

          <!-- DLCs para jogos que o usuário JÁ TEM -->
          <div>
            <div class="sidebar-block-title">DLCs DA SUA BIBLIOTECA</div>
            <!-- Preenchido via JS (renderDlcs) a partir de STORE_DLCS -->
            <div id="dlcList"></div>
          </div>

          <!-- Soundtracks (foco do projeto: música > consumismo) -->
          <div>
            <div class="sidebar-block-title">SOUNDTRACKS</div>
            <!-- Preenchido via JS (renderSoundtracks) a partir de STORE_SOUNDTRACKS -->
            <div id="soundtrackList"></div>
          </div>

        </div>

        <!-- MAIN CONTENT (Jogos) -->
        <div class="loja-main">

          <!-- Lista única e dinâmica de jogos.
               O título, contador e os cards são gerados pelo JS
               (renderGames), de acordo com a categoria/busca atuais. -->
          <div class="loja-window">
            <div class="win-titlebar">
              <span id="gameListTitle">🌐 Todos os Jogos</span>
              <div class="win-controls">
                <div class="win-btn">_</div>
                <div class="win-btn">□</div>
                <div
                  class="win-btn"
                  onclick="this.closest('.loja-window').style.display = 'none'"
                >✕</div>
              </div>
            </div>
            <div class="win-content" style="padding: 6px 8px 0">
              <span id="gameListCount" class="game-list-count"></span>
            </div>
            <!-- Os cards de jogo (.game-card) são inseridos aqui pelo JS -->
            <div class="win-content" id="gameList" style="padding: 0"></div>
          </div>

        </div>
      </div>
      
      <!-- MENU DE NAVEGAÇÃO GLOBAL INFREIOR -->
      <div class="global-nav">
        <button class="gnav-btn" onclick="window.location.href='homepage.html'">🏠 Home</button>
        <div class="gnav-separator"></div>
        <button class="gnav-btn active" onclick="window.location.href='loja.html'">🛒 Loja</button>
        <div class="gnav-separator"></div>
        <button class="gnav-btn" onclick="window.location.href='biblioteca.html'">📚 Biblioteca</button>
        <div class="gnav-separator"></div>
        <button class="gnav-btn" onclick="window.location.href='perfil.html'">👤 Perfil</button>
        <div class="gnav-separator"></div>
        <button class="gnav-btn" onclick="window.location.href='Configuração.html'">⚙️ Config</button>
        <div class="gnav-separator"></div>
        <button class="gnav-btn" onclick="window.location.href='suporte.html'">❓ Suporte</button>
      </div>
    </div>

    <!-- CAIXA DE MENSAGENS (Toast) -->
    <div class="toast" id="toast"></div>

    <script src="../js/storeData.js"></script>
    <script src="../js/scriptLoja.js"></script>
  </body>
</html>
