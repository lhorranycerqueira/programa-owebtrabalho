<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>homepage</title>
    <!--declaração de relação css e js e importação de fontes-->
    <link
      href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&family=Orbitron:wght@400;700;900&display=swap"
      rel="stylesheet"/>
    <link rel="stylesheet" href="../css/root.css">
    <link rel="stylesheet" href="../css/styleHomepage.css">
    <script src="../js/scriptHomepage.js" defer></script>
</head>
<body>
    <div id="page-home" class="page">
        <!--div responsavel por puxar os elementos do background synthwave do css e js-->
        <div class="synth-bg">
        <div class="stars" id="homeStars"></div>
            <div class="horizon">
                <div class="grid-floor"></div>
                <div class="neon-line" style="top: 0"></div>
                <div class="neon-line" style="top: 60%"></div>
            </div>
        </div>
        <!--div responsavel por puxar o icone de usuario do css e redirecionar para pag de perfil-->
      <button class="user-icon-btn" id="click-redirection-perfil">
        <svg viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="1.5">
          <circle cx="12" cy="8" r="4" />
          <path d="M4 20c0-4 3.6-7 8-7s8 3 8 7" />
        </svg>
      </button>
      <!--div engloba logo titulo e subtitulo para redirecionamento-->
      <div class="home-logo-area" style="z-index: 10" id="click-redirection-entrar">
        <div class="retro-sun" style="width: 140px; height: 140px"></div>
        <h1 class="home-title">SteamWave</h1>
        <p class="home-subtitle">[ Clique para entrar ]</p>
      </div>
    </div>
</body>
</html>
