version: '3.8'
services:
  db:
    image: mysql:8.0
    container_name: steamwave-db
    restart: always
    environment:
      MYSQL_DATABASE: steamwave
      MYSQL_ALLOW_EMPTY_PASSWORD: 'yes'
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql

volumes:
  db_data: