<!DOCTYPE html>
<html lang="pt-br">
<!-- adaptei o HTML para o CSS ter uma estética parecidaa com o restante do site, como é esperado de um usuário -->
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Steam - Autenticação</title>
    <link rel="stylesheet" href="../css/styleCadastro.css">
    <link rel="stylesheet" href="../css/fontes.css">
</head>
<body class="main-container">

    <!-- fundo com estrelas + grid (não mexam nessa div) -->
    <div id="synth-bg" aria-hidden="true">
        <div class="horizon">
            <div class="grid-floor"></div>
        </div>
    </div>

    <!-- card de cadastro -->
    <div class="steam-auth-container">

        <!-- linha scanner animada no topo do card -->
        <div class="scan-line" aria-hidden="true"></div>

        <div id="register-section">
            <h1 class="auth-title">CRIAR CONTA</h1>

            <div class="input-group">
                <label for="reg-user">EMAIL:</label>
                <input type="text" id="reg-user" required autocomplete="username">
            </div>

            <div class="input-group">
                <label for="reg-pass">SENHA:</label>
                <div class="password-wrapper">
                    <input type="password" id="reg-pass" required autocomplete="new-password">
                    <button type="button" class="password-toggle" onclick="togglePassword('reg-pass', this)">👁</button>
                </div>
            </div>

            <div class="action-area">
                <button class="btn-steam-primary" id="btn-cadastrar">CADASTRAR</button>
                <a href="login.html" class="toggle-link">Já tem uma conta? Iniciar sessão</a>
            </div>
        </div>

    </div>

    <!--PopUp do captcha quando for fazer o cadastro-->
    <div class="captcha-modal" id="captchaModal">
        <div class="captcha-modal-box">
            <button class="captcha-modal-close" onclick="fecharCaptchaModal()">✕</button>
            <h3 class="captcha-modal-title">VERIFICAÇÃO</h3>
            <p class="captcha-modal-desc">Digite os números da imagem abaixo</p>
            <img id="captchaImg" src="" alt="Captcha" class="captcha-img">
            <button type="button" class="captcha-refresh" onclick="carregarCaptcha()">Novo captcha</button>
            <input type="text" id="captchaAnswer" placeholder="Digite os números" class="captcha-modal-input">
            <button class="btn-steam-primary captcha-modal-btn" onclick="enviarCadastro()">CONFIRMAR</button>
        </div>
    </div>

    <div class="toast" id="toast"></div>

    <script src="../js/scriptCadastro.js" defer></script>
</body>
</html>
