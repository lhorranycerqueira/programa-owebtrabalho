<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SteamWave - Perfil</title>
  
  <!-- 1. IMPORTAÇÃO DA FONTE RETRÔ DO GOOGLE -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">

  <!-- 2. IMPORTAÇÃO DOS ESTILOS GLOBAIS -->
  <link rel="stylesheet" href="../../css/root.css">
  <link rel="stylesheet" href="../../css/tema.css">
  
  <!-- 3. SEU ESTILO ESPECÍFICO DO PERFIL -->
  <link rel="stylesheet" href="../../css/perfil/stylePerfil.css">
</head>
<body>

  <!-- BOTÃO HAMBÚRGUER PARA ABRIR/FECHAR A SIDEBAR -->
  <button class="hamburger-menu" onclick="toggleSidebar()">☰</button>

  <!-- BARRA LATERAL ESTILO BRAWL STARS -->
  <aside class="brawl-sidebar" id="brawlSidebar">
    <button class="brawl-btn btn-pink active" onclick="window.location.href='perfil.html'">
      <span class="brawl-btn-content">👤 PERFIL</span>
    </button>

    <button class="brawl-btn btn-blue">
      <span class="brawl-btn-content">ℹ️ CONTA</span>
    </button>

    <button class="brawl-btn btn-purple">
      <span class="brawl-btn-content">📜 COMPRAS</span>
    </button>

    <button class="brawl-btn btn-mint" onclick="window.location.href='../biblioteca.html'">
      <span class="brawl-btn-content">📚 BIBLIOTECA</span>
    </button>
  </aside>

  <!-- CONTAINER DE GRUPO PARA CENTRALIZAR AMBAS AS JANELAS LADO A LADO -->
  <main class="main-layout-flex">

    <!-- 1. JANELA DO PERFIL (PERFIL.EXE) -->
    <div class="profile-container">
      
      <!-- ORELHINHA EDITÁVEL -->
      <div class="profile-tab-row">
        <div class="profile-tab" title="Clique para editar o título da aba">
          <span id="profile-tab-title" contenteditable="true" spellcheck="false">PERFIL.EXE</span>
          <span class="edit-hint-icon-tab">✏️</span>
        </div>
      </div>

      <!-- CORPO DA JANELA -->
      <div class="profile-window-body">
        <!-- Efeito visual animado por cima do perfil -->
        <div id="profile-effect" class="profile-effect-overlay"></div>
        
        <!-- BARRA SUPERIOR CONTÍNUA -->
        <div class="profile-dark-bar">
          <div class="profile-controls">
            <!-- LATA DE TINTA (COLOR PICKER SINCADO COM AMBAS AS JANELAS) -->
            <label class="color-picker-wrapper" title="Mudar Cor do Perfil">
              <input type="color" id="profile-color-picker" value="#ff6ec7">
              <span class="paint-bucket-icon">🪣</span>
            </label>

            <!-- BOTÕES DE CONTROLE -->
            <button class="tab-btn">_</button>
            <button class="tab-btn">□</button>
          </div>
        </div>

        <!-- INPUTS INVISÍVEIS PARA UPLOAD DE BANNER E FOTO -->
        <input type="file" id="avatar-upload-input" accept="image/*" style="display: none;">
        <input type="file" id="banner-upload-input" accept="image/*" style="display: none;">

        <!-- BANNER DE FUNDO SUPERIOR -->
        <div class="profile-banner" id="user-banner">
          <!-- NOVO: Botão de editar que aparece no canto do banner -->
          <div class="banner-edit-overlay" title="Mudar Banner">✎</div>
        </div>
        

        <!-- FOTO DE PERFIL COM SLOT DE BORDA DINÂMICA -->
        <div class="avatar-holder" id="user-avatar-holder">
          <img src="../../assent/avatarGenerico.png" id="user-avatar" alt="Avatar do Usuário">
          <!-- NOVO: Camada escura que cobre o avatar -->
          <div class="avatar-edit-overlay" title="Mudar Avatar">✎</div>
        </div>

        <!-- CORPO INTERNO (TEXTOS EDITÁVEIS) -->
        <div class="profile-body">
          <div class="user-info-text">
            
            <!-- NICKNAME -->
            <div class="editable-container" title="Clique para editar seu nick">
              <h1 id="user-display-name" contenteditable="true" spellcheck="false">Carregando...</h1>
              <span class="edit-hint-icon">✏️</span>
              <div class="char-counter" id="nick-counter">0/30</div>
            </div>

            <span id="user-username" style="display: none;"></span> 
            
            <!-- BIO -->
            <div class="user-bio-box editable-container" title="Clique para editar sua bio">
              <p id="user-bio" contenteditable="true" spellcheck="false">Carregando biografia...</p>
              <span class="edit-hint-icon">✏️</span>
              <div class="char-counter" id="bio-counter">0/220</div>
            </div>

          </div>
        </div>

        <!-- BASE INFERIOR SÓLIDA -->
        <div class="profile-base"></div>
      </div>
    </div>

    <!-- 2. JANELA DE CONFIGURAÇÕES (CONFIG.EXE) -->
    <div class="window-wrapper">
      
      <!-- ORELHINHA DA JANELA CONFIG -->
      <div class="profile-tab-row">
        <div class="profile-tab config-tab">
          <span>CONFIG.EXE</span>
        </div>
      </div>

      <div class="edit-profile-container">
        <!-- BARRA SUPERIOR ESCURA -->
        <div class="profile-top-bar">
            
          <!-- NOVO SELETOR DE COR DA CONFIGURAÇÃO -->
          <label class="color-picker-wrapper" title="Mudar Cor da Configuração" style="margin-right: auto;">
            <input type="color" id="config-color-picker" value="#ff6ec7">
            <span class="paint-bucket-icon">🪣</span>
          </label>

          <div class="window-controls">
            <span class="control-btn minimize">─</span>
            <span class="control-btn maximize">❑</span>
          </div>
        </div>

        <!-- SEÇÕES DE CONFIGURAÇÃO -->
        <div class="edit-profile-body">
          <div class="edit-profile-header">
            <h2>ESPECIFICAÇÕES DO PERFIL</h2>
          </div>
          
          <!-- SEÇÃO: AVATAR -->
          <div class="edit-section">
            <h3>FOTO DE PERFIL</h3>
            <div class="edit-flex-row">
              <label class="custom-file-upload">
                <input type="file" id="edit-avatar-input" accept="image/*">
                Mudar Avatar
              </label>
              
              <div class="select-wrapper">
                <label for="edit-border-select">Borda do Avatar</label>
                <select id="edit-border-select">
                  <option value="none">Nenhuma</option>
                  <option value="neon-cyber">Cyber Neon</option>
                  <option value="pixel-retro">Pixel Retro</option>
                  <option value="glitch">Glitch Effect</option>
                </select>
              </div>
            </div>
          </div>

          <hr class="edit-divider">

          <!-- SEÇÃO: ESTILO DO NOME -->
          <div class="edit-section">
            <h3>ESTILO DO NOME</h3>
            <div class="edit-flex-row">
              <div class="select-wrapper">
                <label for="edit-font-select">Fonte do Nick</label>
                <select id="edit-font-select">
                  <option value="'Press Start 2P', monospace">Press Start 2P</option>
                  <option value="'Inter', sans-serif">Inter</option>
                  <option value="'Courier New', monospace">Courier New</option>
                </select>
              </div>
              
              <div class="color-inputs-group">
                <label>Degradê do Nome</label>
                <div class="pickers-inline">
                  <input type="color" id="name-color-1" value="#ffffff">
                  <input type="color" id="name-color-2" value="#ffffff">
                </div>
              </div>
            </div>
          </div>

          <hr class="edit-divider">

          <!-- SEÇÃO: BANNER -->
          <div class="edit-section">
            <h3>BANNER DO PERFIL</h3>
            <div class="edit-flex-row">
              <label class="custom-file-upload">
                <input type="file" id="edit-banner-input" accept="image/*">
                Upload de Banner
              </label>
              
              <div class="checkbox-wrapper">
                <label class="switch">
                  <input type="checkbox" id="toggle-banner-lines" checked>
                  <span class="slider"></span>
                </label>
                <span class="switch-label">Efeito de Linhas (TV)</span>
              </div>
            </div>
          </div>

          <hr class="edit-divider">

          <!-- SEÇÃO: EFEITO DE PERFIL -->
          <div class="edit-section">
            <h3>EFEITO DE PERFIL (SOBREPOSIÇÃO)</h3>
            <div class="select-wrapper full-width">
              <select id="edit-effect-select">
                <option value="none">Nenhum Efeito</option>
                <option value="chuva-matrix">Chuva Digital (Matrix)</option>
                <option value="folhas-sakura">Pétalas de Sakura (GIF)</option>
                <option value="fogo-neon">Fumaça & Fogo Cyber (GIF)</option>
              </select>
            </div>
          </div>
        </div>

        <!-- BARRINHA INFERIOR DE FECHAMENTO -->
        <div class="profile-bottom-bar"></div>
      </div>
    </div>

  </main>
  
  <!-- MENU DE NAVEGAÇÃO GLOBAL INFERIOR -->
  <div class="global-nav">
    <button class="gnav-btn" onclick="window.location.href='../homepage.html'">🏠 Home</button>
    <div class="gnav-separator"></div>
    <button class="gnav-btn" onclick="window.location.href='../loja.html'">🛒 Loja</button>
    <div class="gnav-separator"></div>
    <button class="gnav-btn" onclick="window.location.href='../biblioteca.html'">📚 Biblioteca</button>
    <div class="gnav-separator"></div>
    <button class="gnav-btn active" onclick="window.location.href='perfil.html'">👤 Perfil</button>
    <div class="gnav-separator"></div>
    <button class="gnav-btn" onclick="window.location.href='../Configuração.html'">⚙️ Config</button>
    <div class="gnav-separator"></div>
    <button class="gnav-btn" onclick="window.location.href='../suporte.html'">❓ Suporte</button>
  </div>

  <script src="../../js/gerenciadorJanelas.js"></script>
  <script src="../../js/perfil/scriptPerfil.js"></script>
</body>
</html>
